name: build

# Every push and pull request: build the tools image, assemble the Amiga
# binaries, run the tests and package a release as a run artifact.
# A tag vX.Y also publishes that package as a GitHub release; the tag must
# match the version in src/ppi2000mem.asm and have a CHANGELOG.md section.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the tools image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: pps040-tools
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assemble, test and package
        run: make release RELEASE_TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pps040
          path: |
            build/release/*.zip
            build/release/*.adf
            build/release/notes.md
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pps040
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.adf \
            --repo "$GITHUB_REPOSITORY" \
            --title "pps040 ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md
